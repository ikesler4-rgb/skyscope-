name: Build Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build installable APK
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        working-directory: android
        run: |
          # Put the compiler errors in one annotation so they are readable without the full log.
          msg=$(grep -E '^e: |error:|What went wrong|^> ' -A3 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build errors::${msg}"

      - name: Publish to the "android-latest" download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SkyScope.apk
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --title "SkyScope for Android (latest)" \
              --notes "Download SkyScope.apk on an Android phone and open it to install. This file is replaced automatically with every update." --prerelease
          fi
          gh release upload android-latest SkyScope.apk --clobber
